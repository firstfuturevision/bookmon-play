<!doctype html><html><head><!--
  ⚠ 수정 시 주의 — BookMon AR 페이지 (단독 페이지용)

  • index.html 과 embed.html 은 같은 내용을 유지한다(한쪽만 고치면 실행 방식에 따라 동작이 갈린다).
      - embed.html : 앱이 현재 페이지에 주입해 실행(통합 모드, 실제 서비스 경로) — src/features/map/arInject.ts
      - index.html : /ar/shooting/ 단독 페이지로 실행(전체 페이지 이동 모드·단독 테스트용)
    두 파일의 차이는 딱 두 가지뿐이어야 한다(예전엔 integrate 가 자동 변환, 지금은 손으로 맞춘다):
      ① 에셋 경로: index.html = 상대경로 "assets/…"  /  embed.html = 절대경로 "/bookmon-play/ar/shooting/assets/…"
         (주입되면 기준 URL 이 앱 페이지라 상대경로가 404 가 된다)
      ② 종료 처리: embed.html 만 결과를 window.__bookmonEmbeddedDone(res) 로 앱에 넘긴다
  • "/bookmon-play/ar/shooting/…" 경로는 GitHub Pages 배포 때 scripts/gh-pages-rewrite.mjs 가 basePath 를 붙인다
    → 따옴표 안 리터럴로 둘 것(문자열을 이어 붙여 만들면 접두가 안 붙어 배포본에서 404).
  • 여기서 싣는 스크립트나 UI 이미지를 추가·변경하면 src/features/map/arPrefetch.ts 의 목록도 맞출 것
    (지도에서 미리 받아 두는 캐시. 안 맞으면 첫 AR 로딩이 다시 느려진다).
  • 게임 로직은 bundle.js(빌드 산출물)에 있고, 이 파일의 JS 는 그 로직이 부르는 UI 훅(window.__bookmonUI 등)이다.
    함수 이름/인자를 바꾸면 bundle.js 쪽 호출이 깨진다 — bundle.js 맨 앞 주석의 "계약" 참고.
  • 직접 수정 이력: 저장소 루트 README "AR 모듈 — 빌드 산출물 직접 수정 이력".
--><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BookMon AR — Shooting</title><meta itemprop="name" content="BookMon AR — Shooting"><meta name="twitter:title" content="BookMon AR — Shooting"><meta property="og:title" content="BookMon AR — Shooting"><meta property="og:site_name" content="BookMon AR"><meta name="description" content="World-tracking AR shooting game: aim the crosshair at BookMon monsters and tap to hit."><meta itemprop="description" content="World-tracking AR shooting game: aim the crosshair at BookMon monsters and tap to hit."><meta property="og:description" content="World-tracking AR shooting game: aim the crosshair at BookMon monsters and tap to hit."><meta name="twitter:description" content="World-tracking AR shooting game: aim the crosshair at BookMon monsters and tap to hit."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap"><script crossorigin="anonymous" src="./external/runtime/runtime.js"></script><script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script><script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script></head><body><style>#boot-overlay {
    /* ⚠ 수정 시 주의: z-index 55 — 앱의 지도→AR 페이드(useEncounterFlow)와 이어지고, 다음 판 재시작 때
       게임 UI(z 20: 조준점·안내)가 로딩 중에 비치지 않게 그 위(퀴즈 z 60 보다는 아래).
       배경 = 온보딩 메인 배경(main_bg) + 가운데 북몬 로고 — 검은 화면 대신 온보딩과 톤을 잇는다. */
    position: fixed; inset: 0; z-index: 55;
    background: #241a12 url(/bookmon-play/images/onboarding/main_bg.webp) center / cover no-repeat; opacity: 1;
    transition: opacity 0.8s ease;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #boot-overlay.fade-out { opacity: 0; pointer-events: none; }
  /* 가독성용 어두운 오버레이(온보딩과 동일 톤) + 가운데 북몬 로고(메인 마크). */
  #boot-overlay::before { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.3); }
  #boot-overlay .boot-logo { position: relative; z-index: 1; width: min(62vw, 340px); height: auto; filter: drop-shadow(0 4px 14px rgba(0,0,0,0.45)); }
  /* Tiny loading label, bottom-left. Animated "..." dots show progress. */
  #boot-overlay .loading {
    position: absolute; left: 14px; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    font-size: 11px; letter-spacing: 0.3px; color: #9aa0aa;
  }
  #boot-overlay .loading .dots::after {
    content: ''; animation: loading-dots 1.2s steps(1,end) infinite;
  }
  @keyframes loading-dots {
    0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } 100% { content: ''; }
  }
  /* Desktop / unsupported guidance — centered, shown only on non-mobile. */
  #boot-overlay .desktop-hint {
    display: none; position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%); width: 320px; max-width: 80%;
    margin: 0; text-align: center; color: #c8ccd2; font-size: 14px; line-height: 1.6;
  }

  /* Shot muzzle flash: a quick, clearly-visible full-screen flash on each shot.
     A bright center burst + warm edge glow reads as a gun muzzle flash. */
  #shot-flash {
    position: fixed; inset: 0; z-index: 40; pointer-events: none; opacity: 0;
    background:
      radial-gradient(circle at center, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.0) 42%),
      radial-gradient(circle at center, rgba(255,180,60,0.0) 55%, rgba(255,150,30,0.55) 100%);
  }
  #shot-flash.fire { animation: shot-flash 200ms ease-out; }
  @keyframes shot-flash { 0% { opacity: 1; } 60% { opacity: 0.7; } 100% { opacity: 0; } }

  /* 캡처 효과 — 사진이 찍힐 때마다 받은 투명 영상 프레임을 background-image 로 바꿔 끼운다(playCaptureFlash). 바탕은 투명. */
  #shutter-flash {
    position: fixed; inset: 0; z-index: 43; pointer-events: none; opacity: 0;
    background: transparent center / cover no-repeat;
  }
  #shutter-flash.snap { animation: shutter-snap 260ms ease-out; }
  @keyframes shutter-snap { 0% { opacity: 0; } 30% { opacity: 0; } 42% { opacity: 0.95; } 100% { opacity: 0; } }

  /* Mechanical shutter: black curtains snap CLOSED from top & bottom to meet at
     center, then open — the viewfinder blackout of a real camera. The white flash
     above fires as they open. Together they read clearly as "찰칵". */
  #shutter-blades { position: fixed; inset: 0; z-index: 42; pointer-events: none; }
  #shutter-blades .blade {
    position: absolute; left: 0; right: 0; height: 51%; background: #000;
  }
  #shutter-blades .blade.top { top: 0; transform: translateY(-101%); }
  #shutter-blades .blade.bot { bottom: 0; transform: translateY(101%); }
  #shutter-blades.snap .blade.top { animation: blade-top 260ms cubic-bezier(0.5, 0, 0.5, 1); }
  #shutter-blades.snap .blade.bot { animation: blade-bot 260ms cubic-bezier(0.5, 0, 0.5, 1); }
  @keyframes blade-top {
    0% { transform: translateY(-101%); } 40% { transform: translateY(0); }
    52% { transform: translateY(0); } 100% { transform: translateY(-101%); }
  }
  @keyframes blade-bot {
    0% { transform: translateY(101%); } 40% { transform: translateY(0); }
    52% { transform: translateY(0); } 100% { transform: translateY(101%); }
  }

  /* ===== End-of-game result effect (replaces the success/fail text overlays) ===
     Driven by __bookmonUI.showResult('success'|'fail'). Plays during the end
     grace period before the page navigates back to the host. */
  #result-fx { position: fixed; inset: 0; z-index: 50; pointer-events: none; opacity: 0; }
  /* SUCCESS — the screen gradually fills with white. */
  #result-fx.win { background: #ffffff; animation: result-win 1.8s ease-in forwards; }
  @keyframes result-win { 0% { opacity: 0; } 100% { opacity: 1; } }
  /* FAIL — a quick red flash, then the screen dims to a dark red vignette. */
  #result-fx.lose {
    background:
      radial-gradient(circle at center, rgba(120, 0, 0, 0) 25%, rgba(15, 0, 0, 0.9) 100%),
      rgba(60, 0, 0, 0.35);
    animation: result-lose 1.4s ease-out forwards;
  }
  @keyframes result-lose {
    0% { opacity: 0; }
    10% { opacity: 1; }          /* quick red flash */
    26% { opacity: 0.72; }       /* settle */
    100% { opacity: 1; }         /* dark vignette holds */
  }
  /* After the fail vignette holds for a beat, a white layer fades IN on top,
     covering the vignette so the run ends on a clean white screen (like success). */
  #result-white {
    position: fixed; inset: 0; z-index: 52; background: #ffffff;
    opacity: 0; pointer-events: none; transition: opacity 1.5s ease;
  }
  #result-white.show { opacity: 1; }

  /* Camera shake: applied to the AR canvas. The slight scale hides the edges
     that the translation would otherwise reveal. */
  canvas.cam-shake { animation: cam-shake 240ms ease-in-out; }
  canvas.cam-shake-strong { animation: cam-shake-strong 300ms ease-in-out; }
  @keyframes cam-shake {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-7px, 5px) scale(1.05); }
    45% { transform: translate(7px, -5px) scale(1.05); }
    70% { transform: translate(-5px, -4px) scale(1.05); }
    88% { transform: translate(4px, 4px) scale(1.04); }
  }
  @keyframes cam-shake-strong {
    0%, 100% { transform: translate(0, 0); }
    18% { transform: translate(-12px, 8px) scale(1.08); }
    38% { transform: translate(11px, -9px) scale(1.08); }
    58% { transform: translate(-9px, -6px) scale(1.07); }
    80% { transform: translate(8px, 7px) scale(1.06); }
  }

  /* ===== Game UI (HTML overlay above the AR canvas) ===================== */
  /* Driven by window.__bookmonUI from the game (shooting-game.ts). Two phases:
     'kill' (shoot the health gauge) and 'capture' (indicator mini-game). */
  #game-ui {
    position: fixed; inset: 0; z-index: 20; pointer-events: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    /* Responsive sizing tokens — clamp(min, vmin-based, max) so the HUD scales up
       on tablets (bigger screen ⇒ bigger UI) while staying sensible on phones.
       vmin (short side) avoids over-scaling on wide/landscape tablets. */
    --cap-btn: clamp(136px, 22vmin, 184px);        /* 카메라 버튼 — 누르기 편하게 2배(폰 ≈136px). ⚠ 게이지 폭 계산에도 쓰임 */
    --cap-gauge-h: clamp(16px, 2.6vmin, 28px);     /* gauge bar height */
    --cap-bar-pad: clamp(14px, 2.4vmin, 30px);     /* bottom bar padding */
    --cap-btn-gap: clamp(16px, 2.6vmin, 34px);     /* button inset from right edge */
    --cap-readout: clamp(11px, 1.9vmin, 18px);     /* center "📷 30초" font size */
  }
  #xh-kill, #xh-cap { display: none; }
  #game-ui[data-phase="kill"] #xh-kill { display: block; }
  /* 'aim' — the intro phase: ONLY the crosshair (조준점) is shown while we wait
     for a monster to enter the frame and run the countdown. */
  #game-ui[data-phase="aim"] #xh-cap { display: block; }
  #game-ui[data-phase="capture"] #xh-cap { display: block; }
  #game-ui[data-phase="capture"] #cap-bar { display: flex; }
  #game-ui[data-phase="capture"] #cap-progress { display: flex; }
  /* 조준 단계 안내 문구(휴대폰 세우기 / 둘러보기) — bundle 이 __bookmonUI.setHint(text|null) 로 켜고 끈다.
     ⚠ 수정 시 주의: setHint 는 매 틱 불린다 → 같은 문구면 DOM 을 건드리지 않게 되어 있음(아래 JS). */
  #aim-hint { position:absolute; left:50%; top:calc(14% + env(safe-area-inset-top,0px)); transform:translateX(-50%); display:none; padding:.5em 1.1em; border-radius:9999px; background:rgba(18,33,58,.72); color:#fff; font:700 clamp(13px,2.4vmin,20px)/1.3 'Noto Sans KR',-apple-system,sans-serif; white-space:nowrap; pointer-events:none; }
  #aim-hint.show { display:block; animation:hint-bob 1.6s ease-in-out infinite; }
  /* ===== 포획 연출(capture-fx) — 책이 열리며 빛 기둥으로 몬스터를 빨아들인 뒤 닫힌다(회오리 고리는 뺐다 — 사용자 결정). =====
     ⚠ 수정 시 주의: 책 그림 capture_book.webp 는 mk_book.glb 를 Blender 로 펼친 14프레임 가로 시트(프레임 600×467 — 선명하게 2배,
       책등 = 가로 50.1%·세로 66.9%). 시트를 다시 만들면 아래 JS 의 CF 값도 같이 바꿀 것. 퀴즈(z 60)보다 아래(z 45). */
  /* 포즈(마지막 사진 뒤) — 화면 가운데 크게. 책 연출(z 45)·퀴즈(z 60)보다 아래. */
  #pose-center { position:fixed; left:50%; top:50%; height:min(66vh, 560px); width:auto; transform:translate(-50%,-50%); z-index:44; pointer-events:none;
    filter:drop-shadow(0 10px 16px rgba(0,0,0,.4)); }
  #capture-fx { position:fixed; inset:0; z-index:45; pointer-events:none; overflow:hidden; }
  #capture-fx > * { position:absolute; }
  #capture-fx .cf-book { background-repeat:no-repeat; background-size:1400% 100%; transform-origin:50.1% 66.9%; filter:drop-shadow(0 6px 10px rgba(0,0,0,.45)) brightness(1.08) saturate(1.12) contrast(1.05); }
  /* 빛 기둥 = 받은 영상(shining-light-rays) 앞 2초를 12fps·24프레임 6×4 시트로(검정 바탕 → 밝기만큼 투명). 섞기 모드 대신 투명 PNG 방식인 건
     AR 카메라 캔버스가 다른 층이라 screen 섞기가 카메라와 안 섞여서(검정이 그대로 보임). 시트를 다시 만들면 JS 의 CR 값도 같이. */
  #capture-fx .cf-rays { background-repeat:no-repeat; background-size:600% 400%; opacity:0; transition:opacity .45s; }
  #capture-fx .cf-rays.on { opacity:1; }
  #capture-fx .cf-flash { width:10px; height:10px; border-radius:50%; transform:translate(-50%,-50%) scale(0); opacity:0; background:radial-gradient(circle, #fff 0 30%, rgba(255,240,190,.8) 50%, rgba(255,255,255,0) 72%); mix-blend-mode:screen; }
  #capture-fx .cf-spark { width:8px; height:8px; margin:-4px 0 0 -4px; border-radius:50%; background:#fff6c8; box-shadow:0 0 8px 3px rgba(255,230,140,.9); }
  @keyframes hint-bob { 0%,100%{transform:translate(-50%,0)} 50%{transform:translate(-50%,-4px)} }

  /* Kill-phase crosshair (sniper reticle), centered. */
  #xh-kill {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 150px; height: auto;
  }

  /* Capture-phase reticle: viewfinder corner brackets + center circle. The
     bracket FRAME spans from near the top edge down to JUST ABOVE the gauge bar
     (so the bottom corners never overlap the gauge / camera button). The aim
     circle is positioned independently at the true screen centre. */
  #xh-cap {
    position: fixed; left: 4vw; right: 4vw; top: 7vh;
    /* Bottom edge sits above the gauge row + its sweeping arrow. */
    bottom: calc(var(--cap-bar-pad) + var(--cap-gauge-h) + 46px + env(safe-area-inset-bottom, 0px));
    transform: none;
  }
  #xh-cap .corner {
    position: absolute; border: 3px solid #fff;
    width: clamp(30px, 5vmin, 56px); height: clamp(30px, 5vmin, 56px);
    border-width: clamp(3px, 0.5vmin, 5px);
  }
  #xh-cap .corner.tl { left: 0; top: 0; border-right: 0; border-bottom: 0; }
  #xh-cap .corner.tr { right: 0; top: 0; border-left: 0; border-bottom: 0; }
  #xh-cap .corner.bl { left: 0; bottom: 0; border-right: 0; border-top: 0; }
  #xh-cap .corner.br { right: 0; bottom: 0; border-left: 0; border-top: 0; }
  /* Aim circle — fixed at the TRUE screen centre (aim point), independent of the
     bracket frame so shifting the frame up never moves the aim reticle. */
  #xh-cap-center {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: clamp(180px, 52.5vmin, 660px); height: auto;   /* 1.5× larger aim circle */
  }
  /* Quick reticle pop on each capture (paired with the shutter flash) — applied
     to the centre aim circle (the frame no longer uses a centering transform). */
  #xh-cap.snap #xh-cap-center { animation: cap-snap 220ms ease-out; }
  /* 조준 원(HUD) — 받은 디자인 그림 두 장: aim_ring(북몬이 원 밖, 흰색) / aim_ring_on(원 안 .locked, 청록 빛). 둘 다 깔아 두고 투명도만 바꾼다(처음 바뀔 때 깜빡임 방지).
     ⚠ 수정 시 주의: 보이지 않는 #xh-ring 요소의 반지름(window.__bmRingR)이 bundle 의 조준·발견(카운트다운) 판정 기준이고,
     그림은 그 원에 점선 원이 맞도록 키운다 — 그림 960×720 에서 점선 반지름 348px → 폭 = 요소 폭 × 960/696(137.93%). 그림을 바꾸면 이 배율도 다시 잴 것.
     흰 그림은 밝은 카메라 화면에서도 보이게 옅은 검은 그림자를 깐다. */
  #xh-cap .corner, #xh-cap-center { display: none !important; }
  #xh-ring { position: fixed; left: 50%; top: 50%; width: min(62vmin, 560px); aspect-ratio: 1; transform: translate(-50%, -50%); pointer-events: none; }
  #xh-ring::before, #xh-ring::after { content: ''; position: absolute; left: 50%; top: 50%; width: 137.93%; aspect-ratio: 4 / 3; transform: translate(-50%, -50%);
    background: url('assets/aim_ring.webp') center / 100% 100% no-repeat; filter: drop-shadow(0 0 1px rgba(0,0,0,.5)); transition: opacity .18s; }
  #xh-ring::after { background-image: url('assets/aim_ring_on.webp'); filter: none; opacity: 0; }
  #xh-ring.locked::before { opacity: 0; }
  #xh-ring.locked::after { opacity: 1; }
  #xh-cap.snap #xh-ring { animation: ring-snap 220ms ease-out; }
  @keyframes ring-snap { 0%,100% { transform: translate(-50%,-50%) scale(1); } 35% { transform: translate(-50%,-50%) scale(1.06); } }
  /* 북몬 찾기 전(aim 단계, .found 없음): 사각 카메라 프레임은 숨기고 조준선만 2배로. 찾은 뒤부터 프레임 표시·원래 크기.
     ⚠ 수정 시 주의: .found 는 __bookmonUI.fireDiscovery 가 켜고 setPhase('aim')(새 판 시작)이 끈다. */
  #xh-cap-center { transition: width .35s ease; }
  #game-ui[data-phase="aim"]:not(.found) #xh-cap .corner { display: none; }
  #game-ui[data-phase="aim"]:not(.found) #xh-cap-center { width: clamp(360px, 105vmin, 1320px); }
  @keyframes cap-snap {
    0% { transform: translate(-50%, -50%) scale(1); }
    35% { transform: translate(-50%, -50%) scale(1.12); }
    100% { transform: translate(-50%, -50%) scale(1); }
  }
  /* Miss feedback — a quick red flash on the corner brackets when the shutter is
     pressed without the monster locked on. */
  #xh-cap.miss .corner { animation: cap-miss 0.3s ease-out; }
  @keyframes cap-miss {
    0%, 100% { border-color: #fff; }
    40% { border-color: #ff5a5a; }
  }

  /* ===== Intro sequence (crosshair-only → discovery → 3·2·1 → 시작!) ======
     1) 'aim' phase shows ONLY the crosshair.
     2) When a monster enters the frame, #discover-fx (effect.png) bursts AT the
        monster's on-screen position ("발견!" feel).
     3) A 3·2·1 countdown, then the #start-banner (start.png, "Go").
     4) The capture bar appears and the mini-game begins. */
  /* Discovery burst — centered ON THE MONSTER (Figma: the burst surrounds the monster).
     left/top are set inline from the monster's screen position (% of the viewport) and
     follow it while it walks in; falls back to screen center when no position is known. */
  #discover-fx {
    position: fixed; left: 50%; top: 50%; width: min(120vw, 820px); height: auto;
    transform: translate(-50%, -50%) scale(0.4); opacity: 0; pointer-events: none;
    display: none; z-index: 22;
  }
  #discover-fx.play { display: block; animation: discover-fx 950ms ease-out forwards; }
  @keyframes discover-fx {
    0%   { transform: translate(-50%, -50%) rotate(0deg) scale(0.4); opacity: 0; }
    25%  { opacity: 1; }
    60%  { transform: translate(-50%, -50%) rotate(140deg) scale(1.15); opacity: 0.9; }
    100% { transform: translate(-50%, -50%) rotate(210deg) scale(1.5); opacity: 0; }
  }

  /* Countdown (3·2·1): a full-screen FLEX wrapper centers the number image so it's
     centered regardless of the glyph's width or the viewport orientation. The
     glyphs are TALL, so the image is sized by height. */
  #countdown {
    position: fixed; inset: 0; display: none; z-index: 23; pointer-events: none;
    align-items: center; justify-content: center;
  }
  #countdown.show { display: flex; }
  /* Per-digit optical-centering shift lives on a WRAPPER (static), separate from
     the img's scale animation, so the correction always holds. Each glyph's
     visual mass is off-centre in its own image (esp. "1", ~15% right).
     translateX(%) is relative to the wrapper's own width (= img width), so it
     stays correct at any size. */
  #countdown .cd-inner { display: block; transform: translateX(var(--cd-shift, 0%)); }
  #countdown.n1 .cd-inner { --cd-shift: -15%; }
  #countdown.n2 .cd-inner { --cd-shift: -2%; }
  #countdown.n3 .cd-inner { --cd-shift: -5%; }
  #countdown-img { height: min(42vh, 340px); width: auto; display: block; }
  #countdown.show #countdown-img { animation: count-pop 1s ease-out; }
  @keyframes count-pop {
    0%   { transform: scale(0.35); opacity: 0; }
    22%  { transform: scale(1.12); opacity: 1; }
    62%  { transform: scale(1); opacity: 1; }
    100% { transform: scale(0.9); opacity: 0; }
  }

  #start-banner {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: calc(min(42vh, 340px) * 1.1); max-width: 80vw; height: auto; display: none; z-index: 23;
    /* Go 는 숫자(3·2·1, 높이 기준)와 같은 기준 — 너비 ≈ 숫자 높이 × 1.1(Figma 비율).
       이미지 비율은 그대로(height:auto), 태블릿 등 어떤 화면에서도 넘치지 않게 max-width. */
  }
  #start-banner.play { display: block; animation: start-banner 900ms ease-out forwards; }
  @keyframes start-banner {
    0%   { transform: translate(-50%, -50%) scale(0.6); opacity: 0; }
    25%  { transform: translate(-50%, -50%) scale(1.08); opacity: 1; }
    70%  { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
  }

  /* Capture progress dots (top-center): one per required capture, filled green
     as each catch lands. The required count is random (1..3) per run. */
  #cap-progress {
    position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px));
    transform: translateX(-50%); display: none; gap: 9px; align-items: center;
    z-index: 21; pointer-events: none;
  }
  #cap-progress .dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.3); border: 2px solid rgba(255, 255, 255, 0.75);
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }
  #cap-progress .dot.done {
    background: #38ff9e; border-color: #38ff9e; box-shadow: 0 0 8px rgba(56, 255, 158, 0.9);
  }

  /* Capture bottom bar (per the mock): a SLIM gauge, ~60% of the screen wide,
     dead-centered horizontally; the camera button floats at the bottom-right. */
  #cap-bar {
    position: fixed; left: 0; right: 0; bottom: 0; display: none;
    align-items: center; justify-content: center;
    padding: var(--cap-bar-pad) 16px calc(var(--cap-bar-pad) + 4px + env(safe-area-inset-bottom, 0px));
    box-sizing: border-box; pointer-events: none;
  }
  /* Slim gauge — centered; width caps keep it clear of the (responsive) camera
     button on both sides so it stays at the true horizontal centre. */
  #cap-gauge {
    position: relative; flex: 0 0 auto; height: var(--cap-gauge-h);
    /* ~70% of the screen (per the reference), but never so wide it collides with
       the camera button on either side. No fixed max cap — it scales with the
       screen so tablets don't leave it tiny. */
    width: min(70vw, 100vw - (2 * var(--cap-btn) + 3 * var(--cap-btn-gap)));
  }
  /* All gauge layers share border-radius:999px so their corners are unified
     into one pill. The track clips the zone; the frame is a separate top
     overlay (so the zone never hides it). No `border` anywhere — a real
     border + radius + overflow leaves square-ish corners in WebKit.
     Colours sampled from the reference artwork (Frame 175.png). */
  #cap-track {
    position: absolute; inset: 0; border-radius: 999px; overflow: hidden;
    /* Glossy green cylinder — exact design gradient (from the design source). */
    background: linear-gradient(180deg,
      #6EB62D 14.29%, #D6FF5B 27.47%, #BAF154 45.6%, #68AC28 60.03%, #418700 77.34%);
    box-shadow: 0 3px 6px rgba(0, 0, 0, 0.45);
  }
  /* CAPTURE ZONE — the centered dark-green band. The sweeping arrow must be
     inside it when the shutter is pressed; it SHRINKS after every catch so the
     difficulty ramps up. Its own pill radius keeps both ends rounded at every
     width. NOTE: no CSS transform — JS sets `left`+`width` to center it (a
     `translateX` child breaks the parent's rounded clip in WebKit). */
  #cap-zone {
    position: absolute; top: 0; bottom: 0; left: 33%; width: 34%;
    /* Dark-green OVERLAY on the glossy track. Vertical alpha profile measured
       from the artwork (highlight glints through at the top, solid dark from
       ~2/3 down). Left/right edges are HARD, exactly as in the artwork. */
    background: linear-gradient(180deg,
      rgba(0, 58, 27, 0) 0%, rgba(0, 58, 27, 0.19) 24%,
      rgba(0, 58, 27, 0.42) 42%, rgba(0, 58, 27, 0.68) 55%,
      rgba(0, 58, 27, 1) 67%, rgba(0, 58, 27, 1) 100%);
    transition: left 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  }
  /* Shrink emphasis — quick brighten so each difficulty step reads clearly. */
  #cap-zone.shrink { animation: zone-shrink 0.6s ease-out; }
  @keyframes zone-shrink {
    0% { filter: brightness(2); }
    100% { filter: brightness(1); }
  }
  /* Wood-brown frame ring — drawn on TOP so the zone never covers it. Slim ring
     to match the slim bar; lighter top rim, darker bottom (per the artwork). */
  #cap-frame {
    position: absolute; inset: 0; border-radius: 999px; pointer-events: none; z-index: 2;
    box-shadow: inset 0 0 0 2.5px #73411a,
                inset 0 3px 0 -1px rgba(150, 88, 34, 0.55),
                inset 0 -3px 0 -1px rgba(90, 50, 18, 0.6),
                0 0 0 1px rgba(60, 32, 10, 0.45);
  }
  /* Sweeping indicator arrow (indi.png) above the gauge, pointing down at it.
     NOTE: no `will-change` here. `will-change: left` gave no compositing benefit
     (left can't be composited) yet forced a GPU layer that, combined with the
     drop-shadow filter, made the arrow VANISH on Android Chrome/WebView during
     the capture flash. The shadow lives on a wrapper span so the arrow image
     itself carries no filter (belt-and-suspenders against the same bug). */
  #cap-indi {
    position: absolute; bottom: 100%; left: 4%; z-index: 5;
    transform: translate(-50%, -3px);
    display: block; line-height: 0;
    filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.4));
  }
  #cap-indi img { width: clamp(20px, 3.2vmin, 32px); height: auto; display: block; }
  #cap-indi.miss img { animation: indi-miss 0.3s ease-out; }
  @keyframes indi-miss {
    0%,100% { filter: none; }
    50% { filter: drop-shadow(0 0 6px #ff5a5a); }
  }
  /* Center readout (per the mock): a small yellow camera glyph + "30초" inline,
     dead-center ON the bar, yellow #EDD927 with a dark shadow for contrast. */
  #cap-center {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: flex; align-items: center; gap: 0.28em; z-index: 3; pointer-events: none;
    color: #f2dc32; font-weight: 800; font-size: var(--cap-readout); line-height: 1;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    /* Tight, dark shadow hugging the glyphs (no soft spread). */
    text-shadow: 0 1px 0 rgba(0, 0, 0, 0.9), 0 0 1px rgba(0, 0, 0, 0.85);
    white-space: nowrap;
  }
  #cap-cam-icon {
    width: 0.95em; height: 0.95em; flex: 0 0 auto;
    filter: drop-shadow(0 1px 0 rgba(0, 0, 0, 0.9));
  }
  #cap-cam-icon svg { width: 100%; height: 100%; display: block; }
  /* Camera button — pinned to the bar's right edge (absolute, so it doesn't
     push the gauge off the screen's horizontal centre). */
  #cap-camera {
    position: absolute; right: var(--cap-btn-gap);
    /* ⚠ 수정 시 주의: 2배로 키운 뒤로는 게이지 줄 가운데에 맞추면 화면 아래로 삐져나간다 → 오른쪽 아래 모서리에 붙인다. */
    /* 보이는 버튼의 아랫선 = 게이지바 아랫선(바 아래 여백 pad+4px). cam_normal.png 는 아래 18%·오른쪽 19.5% 가 투명 여백이라 그만큼 뺀다.
       ⚠ 버튼 이미지를 바꾸면 이 비율(0.18 / 0.195)도 다시 잴 것. */
    top: auto; bottom: calc(var(--cap-bar-pad) + 4px + env(safe-area-inset-bottom, 0px) - var(--cap-btn) * 0.18);
    right: calc(max(var(--cap-btn-gap), env(safe-area-inset-right, 0px)) - var(--cap-btn) * 0.195);
    transform: none;
    pointer-events: auto; border: none; background: none; padding: 0;
    width: var(--cap-btn); height: var(--cap-btn);
    outline: none; -webkit-appearance: none; appearance: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
  }
  /* Invisible enlarged tap target (image keeps the button size). */
  #cap-camera::before {
    content: ''; position: absolute; inset: -22px; border-radius: 50%;
  }
  /* Kill the focus/active ring entirely (some browsers draw a pink/dotted
     outline around the tapped camera button). */
  #cap-camera:focus,
  #cap-camera:focus-visible,
  #cap-camera:active { outline: none; border: none; box-shadow: none; }
  #cap-camera img {
    width: 100%; height: 100%; display: block; border: none; outline: none;
    pointer-events: none; -webkit-user-drag: none; user-select: none;
    transition: transform 0.08s ease, filter 0.08s ease;
  }
  /* Press effect (replaces the old cam_press.png image swap). */
  #cap-camera.pressing img,
  #cap-camera:active img { transform: scale(0.86); filter: brightness(0.8); }
  /* Cooldown after a successful capture — dimmed + not pressable for ~2s. */
  #cap-camera.cooldown { pointer-events: none; }
  #cap-camera.cooldown img { filter: grayscale(0.5) brightness(0.6); opacity: 0.6; }

  /* ===== 8th Wall motion-sensor prompt restyle ==========================
     The engine (xr.js) injects its own permission prompt when it can't preempt
     motion access. Its markup is fixed:
       .prompt-box-8w > p + .prompt-button-container-8w > .prompt-button-8w[.button-primary-8w]
     The engine's own <style> uses single-class selectors, so !important here
     wins regardless of injection order. (Text is relabeled via JS below.)
     To REVERT: delete this block and the `customize 8th Wall prompt` script. */
  .prompt-box-8w {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
    width: 18em !important; max-width: 86% !important;
    border-radius: 16px !important; padding: 22px 18px 16px !important;
    color: #16213a !important; font-size: 16px !important;
    background-color: #ffffff !important;
    filter: none !important; box-shadow: 0 10px 34px rgba(0, 0, 0, 0.28) !important;
  }
  .prompt-box-8w p { margin: 2px 6px 18px !important; line-height: 1.55 !important; font-weight: 600 !important; }
  .prompt-button-container-8w { display: flex !important; gap: 10px !important; }
  .prompt-button-8w {
    flex: 1 0 0 !important; border-radius: 999px !important; padding: 12px 0 !important;
    font-weight: 700 !important; border: none !important; outline: none !important;
    background-color: #e7e9ef !important; color: #3a4152 !important;
    -webkit-tap-highlight-color: transparent !important;
  }
  .prompt-button-8w:not(:last-child) { margin-right: 0 !important; }
  .prompt-button-8w.button-primary-8w { background-color: #16213a !important; color: #ffffff !important; }
  /* ===== 퀴즈(카메라 위) — front QuizLayer 충실 포팅(바닐라). =====
     ⚠ 수정 시 주의: 크기·위치는 레퍼런스 목업(1027×638, 책 표지 폭 710px)을 카드 폭(cqw) 비율로 옮긴 값이다.
       quiz_frame.png 는 표지 둘레에 투명 여백이 있어 표지 = 카드 폭의 86.7%. 이미지를 바꾸면 cqw 값 전부 다시 잴 것.
       .q-wrap 의 0.75 = (카드 높이 67.5cqw + 게이지) ÷ 폭 — 줄이면 가로 폰에서 게이지가 화면 밖으로 잘린다. */
  @keyframes q-answer-pop { 0%{transform:scale(.3);opacity:0} 55%{transform:scale(1.18);opacity:1} 75%{transform:scale(.94)} 100%{transform:scale(1);opacity:1} }
  @keyframes q-confetti-fly { 0%{transform:translate(0,0) rotate(0) scale(1);opacity:1} 70%{opacity:1} 100%{transform:translate(var(--cx),var(--cy)) rotate(var(--cr)) scale(.7);opacity:0} }
  #quiz-ui { position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center; background:rgba(18,33,58,.55);
    padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px)); }
  #quiz-ui.show { display:flex; }
  /* Quiz font: Noto Sans KR (buttons don't inherit font-family, so include *). */
  #quiz-ui, #quiz-ui * {
    box-sizing:border-box;
    font-family:'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  /* The whole quiz (card + gauge) scales AS ONE with the screen while keeping its
     proportions: no fixed px cap — the width is driven by the viewport (vw) and
     capped by height (vh) so on a 16:10 tablet the card+gauge always fit and grow
     with the screen. `container-type` makes the gauge use the SAME cqw scale as
     the card, so both stay in proportion at every size. */
  /* Width is capped BY HEIGHT so the whole stack (card ≈0.675×w + gap + gauge)
     always fits inside the visible viewport (dvh = real height minus browser UI)
     minus the safe-area/padding — the gauge can never be clipped off-screen.
     Divisor 0.76 is the safe minimum: any lower clips the card vertically on
     landscape/tablet (the stack already uses most of the height there). vw cap
     98vw lets portrait screens use nearly the full width. Together these enlarge
     the card as much as possible WITHOUT ever clipping the gauge off-screen. */
  .q-wrap { container-type:inline-size; display:flex; flex-direction:column; align-items:center; gap:0;
    width:min(98vw, calc((100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) / 0.75)); }
  .q-card { container-type:inline-size; position:relative; width:100%; aspect-ratio:1400/945; background:url('assets/quiz/quiz_frame.png') 0 0/100% 100% no-repeat; }
  .q-inner { position:absolute; left:8%; right:9%; top:11.6cqw; height:40.2cqw; display:flex; flex-direction:column; }
  .q-title { text-align:center; }
  .q-title p { margin:0; padding:0 2%; font-size:4cqw; line-height:1.2; font-weight:700; color:#3b5ba5; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .q-title .rule { margin:2.1cqw auto 0; height:0.37cqw; min-height:2px; width:65%; border-radius:9999px; background:#4f6fb8; }
  .q-question { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; overflow:hidden; padding:0 1cqw; }
  .q-question p { margin:0; max-width:64cqw; text-align:center; font-weight:500; color:#222; word-break:keep-all; white-space:pre-line; } /* 문항 속 줄바꿈 문자 = 화면 줄바꿈 */
  .q-blank { display:inline-block; width:13.4cqw; height:2.9cqw; margin:0 1cqw; vertical-align:middle; border:max(1px,0.25cqw) solid #4a6db5; border-radius:0.2cqw; background:#fff; }
  .q-pills { margin:0 auto; display:grid; width:61.9cqw; grid-template-columns:repeat(2, minmax(0, 1fr)); column-gap:8.7cqw; row-gap:1.1cqw; }
  .q-pills.tworows { }
  /* 칸은 고정 크기·균일(height 고정, min-height 아님). height 7.2cqw ≈ "3줄 at 1.6cqw(×1.25)=6cqw + 패딩 1.2cqw" → 1~3줄 모두 이 고정 높이 안에 수용. 비율 ≈ 26.6/7.2 ≈ 3.7:1(레퍼런스 톤). 텍스트는 JS(cFont)가 폰트·줄수로 칸 안에 맞춤. */
  .q-pill { position:relative; display:grid; place-items:center; height:7.2cqw; width:100%; min-width:0; margin:0; line-height:1.15; -webkit-appearance:none; appearance:none; border-radius:1cqw; border:max(2px,0.37cqw) solid #78b1ec; background:#fff; color:#111; font-weight:400; font-size:2.4cqw; padding:0.3cqw 1cqw; box-shadow:0 0.3cqw 0.7cqw rgba(60,110,180,.28); transition:.1s; cursor:pointer; }
  /* ⚠ 수정 시 주의: 앱에 주입(embed)되면 앱 공통 CSS(globals.css 의 button 최소 48×48 터치 타겟 등)가 이 화면에도 먹는다.
     퀴즈·포획 버튼은 자체 크기를 쓰므로 되돌린다(퀴즈 보기 버튼이 35→48px 로 두꺼워졌던 문제). id 선택자라 우선순위가 높다. */
  #quiz-ui button, #game-ui button { min-height: 0; min-width: 0; }
  /* 보기 글자 — 항상 가운데. 짧으면 한 줄(폰트 상한), 길면 폰트 하한까지 축소 후 2~3줄 래핑(한글 keep-all). 최대 3줄 clamp(고정 칸 안에 수용), 말줄임 금지 — 폰트를 더 줄여서라도 3줄 안에 들어오므로 clamp 가 실제로 자르지 않음. */
  .q-pill > span { display:-webkit-box; width:100%; text-align:center; white-space:normal; word-break:keep-all; overflow-wrap:anywhere; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden; line-height:1.25; }
  .q-pill:active { transform:translateY(3px) scale(.98); background:#78b1ec; color:#fff; }
  .q-pill.dead { pointer-events:none; opacity:.35; filter:grayscale(1); }
  .q-ox { margin-top:auto; display:flex; align-items:center; justify-content:center; gap:24%; padding:0 8% 1%; }
  .q-oxbtn { position:relative; display:grid; place-items:center; aspect-ratio:1/1; width:22%; border-radius:9999px; border:5px solid; background:#fff; box-shadow:0 6px 10px rgba(0,0,0,.18); transition:.1s; cursor:pointer; }
  .q-oxbtn:active { transform:translateY(3px) scale(.97); }
  .q-oxbtn.dead { pointer-events:none; opacity:.35; filter:grayscale(1); }
  .q-oxbtn svg { width:58%; height:58%; }
  /* Gauge sized in cqw (same container as the card) so it scales in proportion
     with the card on every screen. Width ~72% of the card matches the mock. */
  .q-gauge { width:79%; margin-top:-1.6cqw; flex-shrink:0; border-radius:9999px; padding:0.5cqw; background:#724019; box-shadow:0 4px 8px rgba(0,0,0,.35); }
  .q-track { position:relative; height:2.9cqw; min-height:12px; overflow:hidden; border-radius:9999px; background:#372314; }
  .q-fill { height:100%; border-radius:9999px; background:linear-gradient(180deg,#6eb72d,#055a25); box-shadow:inset 0 2px 2px rgba(255,255,255,.45); transition:width .1s linear; }
  .q-secs { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:max(11px, 2.2cqw); font-weight:800; color:#ffdd32; text-shadow:0 1px 1px rgba(0,0,0,.5); }
  .q-result { position:absolute; inset:0; z-index:10; display:flex; align-items:center; justify-content:center; pointer-events:none; }
  .q-result .mark { font-size:14cqw; font-weight:700; line-height:1; animation:q-answer-pop 520ms cubic-bezier(.34,1.56,.64,1) both; text-shadow:0 3px 0 rgba(0,0,0,.18),0 6px 10px rgba(0,0,0,.25); }
  .q-confetti { position:absolute; left:50%; top:50%; width:0; height:0; }

t>// === iOS motion-sensor permission (preempt 8th Wall's built-in prompt) =====
  // World-tracking AR needs the gyroscope/accelerometer. On iOS 13+ that
  // permission can only be requested from inside a user gesture, so the engine
  // otherwise shows its own "AR requires access to device motion sensors" prompt
  // to obtain that gesture. By requesting it ourselves on the FIRST tap (which is
  // the landing-page start tap), the permission is already granted by the time
  // the engine needs it, so the engine's separate prompt is skipped.
  ;(function () {
    var DME = window.DeviceMotionEvent
    var DOE = window.DeviceOrientationEvent
    var askMotion = DME && typeof DME.requestPermission === 'function'
    var askOrient = DOE && typeof DOE.requestPermission === 'function'

    // ---- Detect an already-granted state so we DON'T request again ---------
    // iOS Safari has no query API for motion permission (navigator.permissions
    // doesn't support it). But when permission is already granted, motion/orient
    // events fire; when not, they never fire. So we listen passively: a real
    // reading means "already granted" → skip requestPermission (and its dialog).
    var granted = false
    function markGranted() { granted = true; stopProbe() }
    function onMotion(e) {

    }
    function stopProbe() {
      window.removeEventListener('devicemotion', onMotion)
      window.removeEventListener('deviceorientation', onOrient)

          .then(function (s) { if (s && s.state === 'granted') granted = true })

    } catch (e) { /* no-op */ }

    var done = false
    function request() {
      if (done) return
      done = true
      document.removeEventListener('pointerdown', request, true)
      document.removeEventListener('touchend', request, true)
      document.removeEventListener('click', request, true)
      if (granted) { stopProbe(); return }   // already granted → no call, no dialog
      // Not known-granted → request now. If it turns out already granted, iOS
      // resolves 'granted' silently (no dialog); otherwise the dialog shows once.
      try { if (askMotion) DME.requestPermission().catch(function () {}) } catch (e) {}
      try { if (askOrient) DOE.requestPermission().catch(function () {}) } catch (e) {}
      stopProbe()

    // Capture phase so we run on the first gesture before other handlers.
    document.addEventListener('pointerdown', request, true)
    document.addEventListener('touchend', request, true)
    document.addEventListener('click', request, true)
  })()

  // on the first user gesture here (8th Wall's start tap provides the required

      var needSprites = !hasSprites || stale01
      var needQuiz = !(existing && existing.quiz && existing.quiz.content)
      if (!needSprites && !needQuiz) return

      var seed = existing || {mid: 'dev', nonce: 'dev', ts: Date.now(), image: '', captures: 3, return: ''}
      if (needSprites) {
        seed.sprites = {
          idle: 'assets/sprites/P_idle.png',
          left: 'assets/sprites/P_run_L.png',
          right: 'assets/sprites/P_run_R.png',
          hit: '',
        }
      }
      // standalone 테스트용 샘플 퀴즈(호스트가 안 줄 때만). 포획 성공 후 카메라 위에 뜬다.

        seed.quiz = {
          content: '책의 정령몬스터들을 찾아 떠나는, 이 독서 행사의 이름은?',
          type: 'CHOICE',
          choice1: 'BOOKMAN', choice2: 'BOOKMON', choice3: 'BOOKMOM', choice4: 'BOOKMONG',
          answer: 2, description: null, title: '테스트 몬스터',

    } catch (e) { /* no-op */ }
  })()

  // 체험모드(req.untimed) — 포획·퀴즈 시간 제한 없음. 재시작마다 req 가 바뀌므로 매번 최신 값을 읽는다.

  // navigates to the return path. `graceMs` keeps rendering briefly first (so a

    // the render loop and blanks the camera canvas to white — which showed
    // through the fail vignette's transparent centre as an instant white screen.

      var pc = document.getElementById('pose-center'); if (pc) pc.remove()

      try { var nr = JSON.parse(sessionStorage.getItem('bookmon-ar-req') || 'null'); var nh = nr && nr.sprites && nr.sprites.hit; if (nh) { var npi = new Image(); npi.src = nh; if (npi.decode) npi.decode().catch(function () {}) } } catch (e3) {}

  // Resolves when all are loaded OR a safety timeout elapses (never hangs).
